[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
# Tests live beside the code they cover, in contracts/*/test.
test = "contracts"
solc = "0.8.33"
evm_version = "cancun"
via_ir = true
# The vendored Honk verifiers compile on the legacy pipeline: solc cannot lay
# out the stack of bb's optimized assembly via IR. Everything else needs IR to
# fit EIP-170.
additional_compiler_profiles = [{ name = "verifiers", via_ir = false }]
compilation_restrictions = [{ paths = "contracts/circuits/*HonkVerifier.sol", via_ir = false }]
optimizer = true
optimizer_runs = 200
# No metadata hash in bytecode, so runtime code, and the hashes in
# CircuitCodehashes.sol, depend on the source and compiler settings alone.
# Explorer verification works via standard-json.
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
    # Google's real JWKS body and a notarized session of it
    # (GoogleJwtRoots.t.sol, GoogleJwtRootsRealSession.t.sol).
    { access = "read", path = "contracts/ceremony/test/fixtures" },
    # Real proofs of each circuit, for the Honk verifiers (see HonkVerifierProofs.t.sol).
    { access = "read", path = "contracts/circuits/test/fixtures" },
    # The shared handle vectors from the pinned circuits release (HandleNode.t.sol).
    { access = "read", path = "contracts/circuits/handles.json" },
]
# Only the `gas` profile writes gas snapshots: they are measured under
# eden-testnet's rules, which a default run would overwrite with cancun's.
gas_snapshot_emit = false

# What verifying a claim costs, recorded in snapshots/ by
# ClaimVerificationGas.t.sol. CI fails when the committed numbers are stale:
# update them with `FOUNDRY_PROFILE=gas forge test`.
#
# Osaka because eden-testnet executes under it, and EIP-7883 reprices the
# MODEXP the Honk verifiers call. `vm.setEvmVersion` cannot stand in: forge
# prices precompiles by the version a transaction starts under. solc 0.8.33
# emits the same bytecode for osaka as for cancun; compare the two builds when
# solc moves.
#
# Not isolated: an isolated call would add a base fee, calldata and cold state
# that the `verify` frame inside a claim does not pay.
[profile.gas]
evm_version = "osaka"
isolate = false
gas_snapshot_emit = true
match_path = "contracts/ceremony/test/ClaimVerificationGas.t.sol"

# CI runs `forge lint -D notes`, which fails on any finding. `forge build`
# runs the same linter but only prints.
#
#   - `-D` also fails on a solc warning, libraries included. forge-std must
#     stay at v1.14 or later: older versions draw solc deprecation warnings.
#   - The lint ids below are the pinned Foundry's (FOUNDRY_VERSION in ci.yml);
#     an older forge refuses unknown ids. Match it with `foundryup -i <version>`.
#
# A single site that is right as written carries a `// forge-lint: disable-...`
# comment with its reason, so the lint stays on elsewhere.
[lint]
# The vendored Honk verifiers are bb's output, rewritten by
# `scripts/vendor-circuit-verifiers.sh` before every build. They still compile
# under `-D`; only the linter skips them.
ignore = ["contracts/circuits/*HonkVerifier.sol"]
# `info` turns on the style lints: naming, named struct fields, unused and
# unaliased imports. `gas` and `code-size` stay off: their advice is a rewrite,
# not a check.
severity = ["high", "med", "low", "info"]
exclude_lints = [
    # Every block.timestamp comparison here decides a validity window of
    # minutes or more; a validator's seconds of latitude only move its edge.
    "block-timestamp",
    # Test stubs live in the file of the test that reads them. Two production
    # files declare, beside their contract, the interface it asks of a
    # collaborator (IGoogleJwtRoots, IHonkVerifier).
    "multi-contract-file",
    # The uses are tests reading files, which fs_permissions above confines to
    # read-only paths; `ffi` is off.
    "unsafe-cheatcode",
]

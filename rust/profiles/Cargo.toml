[package]
name = "libid-profiles"
version = "0.17.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libID-contracts"
description = "The libID ceremony profiles: what each platform's notarized sessions request and reveal, mirroring CeremonyProfile.sol byte for byte."
keywords = ["ethereum", "identity", "oauth", "tlsnotary"]
categories = ["cryptography::cryptocurrencies"]
include = ["src/**", "README.md"]

# No runtime dependencies: a prover, a notary and a backend read these
# constants without inheriting anything. Hashing a platform name into an id is
# the caller's, so keccak is a dev-dependency only.
[dependencies]

# Tests only. The vectors below hash the strings and compare against the
# numbers `CeremonyProfile.t.sol` pins, so nothing published carries this.
[dev-dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
# The head this table pins is a claim about what hyper writes, so the test that
# checks it drives the real encoder rather than a model of one. Tests only:
# nothing published carries any of this.
hyper = { version = "1.1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util"] }

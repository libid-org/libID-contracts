[package]
name = "libid-contracts"
version = "0.17.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libID-contracts"
description = "Typed alloy bindings, embedded forge artifacts, and deploy/upgrade helpers for the libid identity stack (Notary Service, ceremony proof verifier, Platform Verifiers, Google JWT roots, identity registry, deterministic factory)."
keywords = ["ethereum", "alloy", "contracts", "deployment"]
categories = ["cryptography::cryptocurrencies"]
# `include_dir!` embeds `artifacts/`, so it ships with the crate.
include = ["src/**", "artifacts/**", "abi/**", "README.md"]

[dependencies]
alloy = { version = "1", features = [
    "contract",
    "providers",
    "network",
    "transport-http",
    "serde",
] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The backoff timer of `send_with_nonce_retry!`; alloy already brings tokio.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
alloy = { version = "1", features = ["node-bindings", "signer-local"] }
# Path-only, so `cargo publish` drops it. Pins `PlatformVerifier::notarizes`
# and the profile windows to the generated table.
libid-profiles = { path = "../profiles" }
# The anvil suite checks the registry's nodes against libid-identity's.
libid-identity = { path = "../identity", features = ["node"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

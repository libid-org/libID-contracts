[package]
name = "libid-identity"
version = "0.18.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libID-contracts"
description = "The off-chain half of libid identity keys: per-platform handle normalization and id rules, the shared vector tables, and (feature `node`) the SHA-256 nodes a binding is stored under, matching the circuits byte for byte."
keywords = ["ethereum", "identity", "normalization"]
categories = ["cryptography::cryptocurrencies"]
include = ["src/**", "README.md"]

# The transform needs only std; the `node` feature adds SHA-256 for the keys.
[dependencies]
sha2 = { version = "0.10", optional = true }

[features]
node = ["dep:sha2"]
# The shared vector tables (`vectors`), for a consumer's tests.
test-helpers = []

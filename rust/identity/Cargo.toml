[package]
name = "libid-identity"
version = "0.17.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libID-contracts"
description = "The off-chain half of libid identity keys: per-platform handle normalization and id rules, the shared vector tables, and (feature `node`) the SHA-256 nodes a binding is stored under, matching the circuits and HandleNormalizer.sol byte for byte."
keywords = ["ethereum", "identity", "normalization"]
categories = ["cryptography::cryptocurrencies"]
include = ["src/**", "README.md"]

# No default dependencies on purpose: every consumer of the identity system —
# an indexer, a wallet, a backend — needs the transform, and none of them
# should inherit anything for it. The transform needs nothing but the standard
# library; the `node` feature adds SHA-256 for computing the keys themselves.
[dependencies]
sha2 = { version = "0.10", optional = true }

[features]
node = ["dep:sha2"]

[dev-dependencies]
sha2 = "0.10"

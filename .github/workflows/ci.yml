name: CI

# `forge build` feeds the Solidity tests, the vendored Rust artifacts and the
# TypeScript codegen. Jobs that need it run the .github/actions/forge-build
# composite with one cache key per profile, so the first run to warm the
# cache speeds up the rest.
#
# Generated trees are gitignored: the vendored Honk verifiers and platform
# table, rust/contracts/artifacts and ts/packages/contracts/src/abis. Every
# job that compiles the crate or the package regenerates them first.
#
# The release jobs at the bottom name other jobs in `needs:`, so renaming a
# job id breaks them.
#
# Releases: publishing a GitHub Release tagged `v<version>` runs this workflow
# with the release event. versions and publish-check run on every event;
# verify-tag, publish-crates and publish-npm are release-only. See the
# "Releasing" section of the README.
#
# Every third-party action is pinned by commit SHA, with the tag in a comment.

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  # A newer push cancels the run it supersedes.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Every cargo invocation, not just clippy, treats warnings as errors.
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  # CI never reads incremental state, so it is neither written nor cached.
  CARGO_INCREMENTAL: 0
  # Foundry stable release. Part of the forge cache key, so a bump starts a
  # fresh artifact cache.
  FOUNDRY_VERSION: v1.8.5
  # Rust stable, pinned so a toolchain release cannot break CI mid-PR.
  RUST_VERSION: 1.97.1
  # Nightly is for `cargo +nightly fmt` only: options like
  # `imports_granularity` are nightly-only, and stable rustfmt silently ignores
  # them. Dated so a nightly formatting change cannot turn CI red overnight.
  NIGHTLY: nightly-2026-08-10

jobs:
  # ---------------------------------------------------------------------------
  # Solidity: build, tests, lint, formatting.
  # ---------------------------------------------------------------------------
  solidity:
    name: Solidity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      # Upgradeable storage may only grow at the end. The script compares each
      # layout with the snapshot committed beside its contract; see its header.
      - name: Storage layout
        run: |
          python3 scripts/test_check_storage_layout.py
          python3 scripts/check-storage-layout.py

      - name: Test
        working-directory: solidity
        run: forge test -vvv

      # Any finding, notes included, fails the job. The lint set and its
      # exclusions are `[lint]` in solidity/foundry.toml.
      - name: Lint
        working-directory: solidity
        run: forge lint -D notes

      - name: Formatting
        working-directory: solidity
        run: forge fmt --check

  # ---------------------------------------------------------------------------
  # Gas: what verifying a claim costs, committed in solidity/snapshots/. This
  # job remeasures under eden-testnet's rules (the `gas` profile in
  # solidity/foundry.toml), writes the change against the base to the job
  # summary, and fails when the committed numbers are stale.
  # ---------------------------------------------------------------------------
  gas:
    name: Gas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # The base is the first parent: the base branch of a PR's merge
          # commit, the previous commit of a push.
          fetch-depth: 2

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}
          profile: gas

      # From an empty directory, so a file the run does not write again shows
      # as deleted below rather than passing unchanged.
      - name: Measure
        working-directory: solidity
        env:
          FOUNDRY_PROFILE: gas
        run: |
          rm -rf snapshots
          forge test

      - name: Summary
        run: ./scripts/compare-gas-snapshots.py HEAD^1 >> "$GITHUB_STEP_SUMMARY"

      - name: Committed numbers are current
        run: |
          if [ -n "$(git status --porcelain -- solidity/snapshots)" ]; then
            git status --short -- solidity/snapshots
            git diff -- solidity/snapshots
            echo "::error::solidity/snapshots is not what the code measures. Run 'FOUNDRY_PROFILE=gas forge test' in solidity/ and commit the result."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Generated files match their sources: profiles.json, the pinned circuits
  # release's platforms.json and handles.json, and regen-bind-route.py's
  # `bind` route. A stale output passes every per-language test while the
  # languages disagree. The forge-build composite checks the Honk verifiers
  # against their pin.
  # ---------------------------------------------------------------------------
  generated-tables:
    name: Generated tables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No submodules: `forge fmt --raw -` compiles nothing, and the vendor
      # script compiles only the two verifiers, which import nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain only: this job needs the `forge` binary, not the artifacts.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # The generators read the platform table the pinned release ships.
      - name: Vendor the circuits release
        run: ./scripts/vendor-circuit-verifiers.sh

      - name: Generated handle tables are current
        run: python3 scripts/regen-identity-handles.py --check

      - name: Generated ceremony profiles are current
        run: python3 scripts/regen-ceremony-profiles.py --check

      - name: Generated bind route is current
        run: python3 scripts/regen-bind-route.py --check

  # ---------------------------------------------------------------------------
  # Rust: vendored artifacts, formatting, clippy, tests. The artifacts come
  # from `forge build`, and the integration tests spawn `anvil`.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      # Nightly first, stable second: this action makes the LAST toolchain it
      # installs the default, and everything except `cargo +nightly fmt` must
      # run on the pinned stable.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      # Before any cargo step: `include_dir!` embeds this directory, and
      # without it every cargo command fails on a missing path.
      - name: Vendor artifacts
        run: ./scripts/vendor-artifacts.sh

      - name: Formatting (nightly rustfmt)
        working-directory: rust
        # +"$NIGHTLY", not +nightly: the bare channel name makes rustup fetch
        # the LATEST nightly (without the rustfmt component) instead of the
        # pinned one installed above.
        run: cargo +"$NIGHTLY" fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: rust
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # TypeScript: codegen drift, build, tests, lint, formatting. The codegen
  # reads the forge artifacts, so the contracts build first.
  # ---------------------------------------------------------------------------
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      # pnpm before setup-node: `cache: pnpm` shells out to pnpm to locate the
      # store, so the binary has to exist first.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C ts install --frozen-lockfile

      # tsc compiles src/abis into dist, so this has to precede the build.
      - name: Generate ABIs
        run: pnpm -C ts codegen

      - name: Build
        run: pnpm -C ts build

      # The build excludes tests and vitest does not type-check, so this is
      # what enforces the tests' `@ts-expect-error` lines.
      - name: Typecheck, tests included
        run: pnpm -C ts typecheck

      - name: Tests
        run: pnpm -C ts test

      - name: Lint and formatting
        run: pnpm -C ts lint && pnpm -C ts fmt:check

  # ---------------------------------------------------------------------------
  # DCO: every commit carries a Signed-off-by trailer matching its author
  # (CONTRIBUTING.md), checked with plain git over the event's commit range.
  # ---------------------------------------------------------------------------
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A release event carries no commit range, and its commits were checked
    # on their PRs.
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the PR base and the push's `before` must be
          # reachable.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            # Push to main. `before` is all zeros on branch creation and may be
            # unreachable after a force push. Either way, check the head alone.
            zero="0000000000000000000000000000000000000000"
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
              && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE..$PUSH_AFTER"
            else
              echo "No usable push range; checking only the head commit."
              range="$PUSH_AFTER^!"
            fi
          fi

          # Merge commits are exempt, as in the standard DCO probot: nobody
          # authors a merge, and the merged commits are themselves in range.
          missing=0
          for sha in $(git rev-list --no-merges "$range"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            # Dependabot signs off with its support address, not its author address.
            if [ "$author" = 'dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>' ] \
              && git log -1 --format=%B "$sha" \
                | grep -Fxiq 'Signed-off-by: dependabot[bot] <support@github.com>'; then
              continue
            fi
            if git log -1 --format=%B "$sha" \
              | grep -Fxiq "Signed-off-by: $author"; then
              continue
            fi
            echo "::error::commit $sha lacks Signed-off-by matching its author: $author"
            git log -1 --format='  %h %s (%an)' "$sha"
            missing=1
          done

          if [ "$missing" -ne 0 ]; then
            echo "See CONTRIBUTING.md: every commit must certify the DCO."
            exit 1
          fi
          echo "All commits in $range are signed off."

  # ---------------------------------------------------------------------------
  # One version: the crates and the npm package release under one number, and
  # this fails a PR whose manifests disagree.
  # ---------------------------------------------------------------------------
  versions:
    name: Version fields agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Crate and npm versions are equal
        run: ./.github/workflows/scripts/verify-tag.sh

  # ---------------------------------------------------------------------------
  # Publishability, on every PR: both registries' dry-runs over a freshly
  # generated tree, in release order: forge build, vendor the artifacts,
  # generate the ABIs, pack.
  #
  # `cargo publish --dry-run` runs without --no-verify: rebuilding the crate
  # from its own tarball proves the vendored artifacts are included.
  # ---------------------------------------------------------------------------
  publish-check:
    name: Publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Vendor artifacts
        run: ./scripts/vendor-artifacts.sh

      # --allow-dirty: cargo refuses to package untracked files, and
      # artifacts/ is generated above. `include` in Cargo.toml pulls it into
      # the tarball.
      - name: cargo publish --dry-run
        working-directory: rust
        run: |
          cargo publish --dry-run -p libid-identity
          cargo publish --dry-run -p libid-profiles
          cargo publish --dry-run --allow-dirty -p libid-contracts

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C ts install --frozen-lockfile

      - name: Generate ABIs
        run: pnpm -C ts codegen

      - name: Build
        run: pnpm -C ts build

      # From the package directory: with -C, pnpm 10 mangles the flags it
      # forwards to `npm publish` (EUSAGE).
      #
      # "cannot publish over" passes: the version is already on npm, as on main
      # after a release, and packaging succeeded before the registry check.
      - name: pnpm publish --dry-run
        working-directory: ts/packages/contracts
        run: |
          set -euo pipefail
          out=$(pnpm publish --dry-run --no-git-checks 2>&1) && status=0 || status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ] && printf '%s' "$out" | grep -q 'cannot publish over'; then
            echo "::notice::version already on npm; dry-run packaging succeeded up to the registry version check"
            exit 0
          fi
          exit "$status"

  # ---------------------------------------------------------------------------
  # Release-only jobs from here down. A release is cut by publishing a GitHub
  # Release tagged v<version>; nothing publishes from pushes or PRs.
  # ---------------------------------------------------------------------------

  # The tag must name the version the manifests already carry. Every publish
  # job needs this first.
  verify-tag:
    name: Release tag matches versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag equals crate and npm versions
        run: ./.github/workflows/scripts/verify-tag.sh "${{ github.event.release.tag_name }}"

  # crates.io first: it is the harder registry to yank from, so a failure
  # here leaves nothing on npm.
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release' && github.event.action == 'published'
    # `generated-tables` refuses a release whose committed tables differ from
    # their sources.
    needs: [verify-tag, versions, solidity, rust, publish-check, generated-tables]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      # A re-run after a partial release skips crates already published. The
      # sparse index is the source of truth; a 404 means never published.
      - name: Skip crates this version already reached
        id: crates-check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for crate in libid-identity libid-profiles libid-contracts; do
            published="$(curl -fsSL "https://index.crates.io/li/bi/$crate" | jq -r .vers || true)"
            if grep -qxF "$version" <<<"$published"; then
              echo "::notice::$crate $version is already on crates.io; skipping its publish."
              echo "publish-${crate#libid-}=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish-${crate#libid-}=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: cargo publish libid-identity
        if: steps.crates-check.outputs.publish-identity == 'true'
        working-directory: rust
        run: cargo publish -p libid-identity --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: cargo publish libid-profiles
        if: steps.crates-check.outputs.publish-profiles == 'true'
        working-directory: rust
        run: cargo publish -p libid-profiles --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      # Only libid-contracts embeds the artifacts.
      - name: Vendor artifacts
        run: ./scripts/vendor-artifacts.sh

      - name: cargo publish libid-contracts
        if: steps.crates-check.outputs.publish-contracts == 'true'
        working-directory: rust
        run: cargo publish --allow-dirty -p libid-contracts --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  # npm, with provenance. The publish step describes how it authenticates.
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [verify-tag, ts, publish-crates]
    environment: npm-deploy
    permissions:
      id-token: write
      contents: read
    env:
      # Provenance requires a public repository.
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      # OIDC trusted publishing needs npm >= 11.5; the npm bundled with the
      # pinned Node may lag behind.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: pnpm -C ts install --frozen-lockfile

      - name: Generate ABIs
        run: pnpm -C ts codegen

      - name: Build
        run: pnpm -C ts build

      # A prerelease must not become `latest`: 1.2.0-rc.1 publishes under `rc`,
      # a plain release under `latest`. The first prerelease identifier is the
      # dist-tag, and npm rejects one that parses as a version (1.2.3-1).
      - name: Derive dist-tag from version
        id: dist-tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="${version%%+*}"
          if [ "$base" != "${base#*-}" ]; then
            pre="${base#*-}"
            dist_tag="${pre%%.*}"
            if ! printf '%s' "$dist_tag" | grep -qE '^[A-Za-z][A-Za-z0-9._-]*$'; then
              echo "::error::prerelease identifier '$dist_tag' (from $version) is not a usable npm dist-tag; use a form like 1.2.0-rc.1" >&2
              exit 1
            fi
          else
            dist_tag=latest
          fi
          echo "Publishing with dist-tag: $dist_tag"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      # From the package directory, for the pnpm 10 -C bug noted in
      # publish-check.
      #
      # Auth: the org NPM_TOKEN secret when set, a granular @libid token that
      # can create packages, so a new package publishes before it has a
      # trusted publisher. Otherwise OIDC trusted publishing, which needs the
      # package's trusted publisher (libid-org, this repo, ci.yml,
      # npm-deploy). Provenance signs with the runner's OIDC identity either way.
      - name: pnpm publish
        working-directory: ts/packages/contracts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            echo "Authenticating with the org npm token"
          else
            echo "No NPM_TOKEN secret; relying on OIDC trusted publishing"
          fi
          pnpm publish --access public --no-git-checks --tag "${{ steps.dist-tag.outputs.dist-tag }}"

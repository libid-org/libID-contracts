# Install Foundry, vendor the Honk verifiers and the platform table, restore
# the forge artifact cache, and build the contracts. Every job that needs
# `forge build` runs this composite.
#
# The cache key depends only on the Foundry version, the profile and the
# sources, so the first job to save it warms the others. forge's own cache is
# content-addressed, so a restored `out/` rebuilds only what changed.
name: forge-build
description: Install Foundry, restore the shared forge cache, and run `forge build` in solidity/.

inputs:
  foundry-version:
    description: Foundry release to install (the workflow's FOUNDRY_VERSION).
    required: true
  profile:
    description: >-
      Foundry profile to build (FOUNDRY_PROFILE). Part of the cache key: each
      profile compiles under its own settings, and restoring another's `out/`
      would only make forge rebuild it.
    required: false
    default: default

runs:
  using: composite
  steps:
    # Also provides `anvil`, which the Rust integration tests spawn, and
    # `cast`. Pinned by commit: a moved tag must not change what runs in the
    # publish jobs.
    - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: ${{ inputs.foundry-version }}

    # The Honk verifiers and the platform table are gitignored. The script
    # downloads them from the pinned libid-circuits release and checks each
    # tarball against the sha256 in solidity/contracts/circuits/circuits.json.
    # It runs before the cache step so the vendored sources are in the key.
    - name: Vendor circuit verifiers
      shell: bash
      run: ./scripts/vendor-circuit-verifiers.sh

    # The vendor step rewrites CircuitCodehashes.sol, so HonkVerifiers.t.sol
    # would compare the file with itself. This diff holds the committed file
    # to the pinned verifiers.
    - name: CircuitCodehashes.sol matches the vendored verifiers
      shell: bash
      run: git diff --exit-code solidity/contracts/circuits/CircuitCodehashes.sol

    # `solidity/lib/**` hashes the submodule trees, so a submodule bump changes
    # the key. The Foundry version is in the key because artifacts embed
    # compiler metadata.
    - name: Restore forge artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          solidity/out
          solidity/cache
        key: forge-${{ runner.os }}-${{ inputs.foundry-version }}-${{ inputs.profile }}-${{ hashFiles('solidity/**/*.sol', 'solidity/foundry.toml', 'solidity/remappings.txt', 'solidity/lib/**') }}
        restore-keys: |
          forge-${{ runner.os }}-${{ inputs.foundry-version }}-${{ inputs.profile }}-

    # No `--force`: forge's content-addressed cache rebuilds whatever changed,
    # and a warm cache makes this step a near no-op.
    - name: Build contracts
      shell: bash
      working-directory: solidity
      env:
        FOUNDRY_PROFILE: ${{ inputs.profile }}
      run: forge build

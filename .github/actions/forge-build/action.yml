# Install Foundry, vendor the Honk verifiers and the platform table, restore
# the forge artifact cache, and build the contracts.
#
# Every job that needs `forge build` — solidity runs the tests over it, rust
# vendors the artifacts into the crate, ts generates bindings from them, and
# the publish dry-run and both publish jobs do the last two for real — runs
# this composite. Repeating the install + vendor + cache + build stanza in each
# job is how the copies drift, so the sequence lives here once.
#
# The cache key is the SAME in every job that builds the same profile — it is
# derived only from inputs.foundry-version, inputs.profile and the checked-out
# sources — so whichever job saves first warms the others on the same tree.
# Only an exact key restores: forge rebuilding part of another tree's `out/`
# under via_ir can emit different bytecode than a full build, so a new tree
# always builds from scratch.
name: forge-build
description: Install Foundry, restore the shared forge cache, and run `forge build` in solidity/.

inputs:
  foundry-version:
    description: Foundry release to install (the workflow's FOUNDRY_VERSION).
    required: true
  profile:
    description: >-
      Foundry profile to build (FOUNDRY_PROFILE). Part of the cache key: each
      profile compiles under its own settings, and restoring another's `out/`
      would only make forge rebuild it.
    required: false
    default: default
  cache:
    description: >-
      Restore and save the forge artifact cache. The release jobs turn it off,
      so what ships is built from the checkout alone.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Also provides `anvil`, which the rust integration tests spawn, and
    # `cast`. Pinned by commit because this action runs in credential-adjacent
    # jobs and a moved tag should not be able to change what executes.
    - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: ${{ inputs.foundry-version }}

    # The Honk verifiers and the platform table (platforms.json, handles.json)
    # are not in the checkout: they are gitignored, and
    # scripts/vendor-circuit-verifiers.sh downloads them from the pinned
    # libid-circuits release, refusing any tarball whose sha256 is not the
    # literal in solidity/contracts/circuits/circuits.json. So every build,
    # test, dry-run and publish compiles a download the pin has just checked.
    # Before the cache step, so the vendored sources are in the key's hash.
    - name: Vendor circuit verifiers
      shell: bash
      run: ./scripts/vendor-circuit-verifiers.sh

    # The vendor step rewrites CircuitCodehashes.sol and IHonkVerifierErrors.sol
    # from the verifiers it just wrote. The committed files must be what the
    # pin vendors.
    - name: Generated circuit files match the vendored verifiers
      shell: bash
      run: |
        git diff --exit-code solidity/contracts/circuits/CircuitCodehashes.sol \
          solidity/contracts/circuits/IHonkVerifierErrors.sol

    # `solidity/lib/**` hashes the checked-out submodule trees, so bumping a
    # submodule pointer changes the key. The foundry version is in the key too:
    # artifacts embed solc metadata, and a stale `out/` from another compiler
    # is exactly the confusion a cache must not introduce.
    - name: Restore forge artifacts
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          solidity/out
          solidity/cache
        key: forge-${{ runner.os }}-${{ inputs.foundry-version }}-${{ inputs.profile }}-${{ hashFiles('solidity/**/*.sol', 'solidity/foundry.toml', 'solidity/remappings.txt', 'solidity/lib/**') }}

    # On an exact cache hit this is a no-op; otherwise a full build.
    - name: Build contracts
      shell: bash
      working-directory: solidity
      env:
        FOUNDRY_PROFILE: ${{ inputs.profile }}
      run: forge build
